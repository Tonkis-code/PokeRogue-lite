version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: pokerogue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokerogue
      POSTGRES_PASSWORD: pokerogue
      POSTGRES_DB: pokerogue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
